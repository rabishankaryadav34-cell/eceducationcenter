<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>धन्यवाद - Education Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', Arial, sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .box { background: white; padding: 50px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 500px; border-top: 5px solid #efd07b; }
        h1 { color: #0c4a60; margin-bottom: 15px; }
        p { margin-bottom: 25px; color: #444; }
        a { background: #0c4a60; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        a:hover { background: #083344; }
    </style>
</head>
<body>
    <div class="box">
        <h1>धन्यवाद!</h1>
        <p>तपाईंको भर्ना फारम सफलतापूर्वक प्राप्त भएको छ। हामी चाँडै तपाईंलाई सम्पर्क गर्नेछौं।</p>
        <a href="/">गृहपृष्ठमा फर्कनुहोस्</a>
    </div>
</body>
</html>
